[package]
name = "kokorobox-native-napi"
version = "0.5.4"
edition = "2024"
license = "GPL-3.0-only"
description = "KokoroBox native bridge bindings"
repository = "https://github.com/amamiyakokoro/kokorobox-native"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
kokorobox-native = { path = ".." }

[build-dependencies]
napi-build = "2"
