# Platform packages are released with the loader and must be installable as one set.
# Keep the minimum-release-age policy enabled for every third-party dependency.
minimumReleaseAgeExclude:
  - kokorobox-native-darwin-arm64
  - kokorobox-native-darwin-x64
  - kokorobox-native-linux-arm64-gnu
  - kokorobox-native-linux-x64-gnu
  - kokorobox-native-win32-arm64-msvc
  - kokorobox-native-win32-x64-msvc
