[package]
name = "kokorobox-traffic-presenter"
version = "0.16.13"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform traffic status presenter for KokoroBox"
repository = "https://github.com/amamiyakokoro/kokorobox-native"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAttributedString",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSView",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSDictionary",
    "NSGeometry",
    "NSString",
] }
tao = { version = "0.37", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
