name: Build

permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  build-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: napi

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('napi/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Apply release package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $INPUT_VERSION"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $GITHUB_REF_NAME"
              exit 1
            fi
            RELEASE_VERSION="$CLEAN_VERSION"
          else
            echo "Release version is required"
            exit 1
          fi

          export RELEASE_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.RELEASE_VERSION
          for (const file of ['Cargo.toml', 'napi/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8')
            fs.writeFileSync(file, text.replace(/^version = "([^"]+)"/m, `version = "${version}"`))
          }
          const packageFile = 'napi/package.json'
          const json = JSON.parse(fs.readFileSync(packageFile, 'utf8'))
          json.version = version
          fs.writeFileSync(packageFile, `${JSON.stringify(json, null, 2)}\n`)
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cross

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
        working-directory: napi

      - name: Build .node (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm exec napi build --platform --release --strip --no-js --dts napi.generated.d.ts --target ${{ matrix.target }} --use-cross && exit 0
            sleep $((attempt * 10))
          done
          exit 1
        working-directory: napi

      - name: Build .node (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm exec napi build --platform --release --strip --no-js --dts napi.generated.d.ts --target ${{ matrix.target }} && exit 0
            sleep $((attempt * 10))
          done
          exit 1
        working-directory: napi

      - name: Build .node (Windows static CRT)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          for attempt in 1 2 3; do
            pnpm exec napi build --platform --release --strip --no-js --dts napi.generated.d.ts --target ${{ matrix.target }} && exit 0
            sleep $((attempt * 10))
          done
          exit 1
        working-directory: napi

      - name: Upload .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: napi/*.node

  pre-release:
    needs: [build-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0

      - name: Update repository version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        run: |
          CLEAN_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ github.event.inputs.version }}"
            exit 1
          fi

          export CLEAN_VERSION
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.CLEAN_VERSION
          for (const file of ['Cargo.toml', 'napi/Cargo.toml']) {
            const text = fs.readFileSync(file, 'utf8')
            fs.writeFileSync(file, text.replace(/^version = "([^"]+)"/m, `version = "${version}"`))
          }
          const packageFile = 'napi/package.json'
          const json = JSON.parse(fs.readFileSync(packageFile, 'utf8'))
          json.version = version
          fs.writeFileSync(packageFile, `${JSON.stringify(json, null, 2)}\n`)

          const lockPackages = new Set(['kokorobox-native', 'kokorobox-native-napi'])
          const lines = fs.readFileSync('Cargo.lock', 'utf8').split('\n')
          let inPackage = false
          let updatePackage = false
          for (let i = 0; i < lines.length; i += 1) {
            if (lines[i] === '[[package]]') {
              inPackage = true
              updatePackage = false
              continue
            }
            if (inPackage && lines[i].startsWith('name = ')) {
              updatePackage = lockPackages.has(lines[i].slice(8, -1))
              continue
            }
            if (inPackage && updatePackage && lines[i].startsWith('version = ')) {
              lines[i] = `version = "${version}"`
              updatePackage = false
              continue
            }
            if (inPackage && lines[i] === '') {
              inPackage = false
              updatePackage = false
            }
          }
          fs.writeFileSync('Cargo.lock', `${lines.join('\n').replace(/\n+$/, '')}\n`)
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock napi/Cargo.toml napi/package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "update version to $CLEAN_VERSION"
          git push origin HEAD:main

      - name: Tag Repo
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: pre-release
          deleteOnlyFromDrafts: false

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Prerelease
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: pre-release
          files: bin/*
          prerelease: true

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref }}
          deleteOnlyFromDrafts: false

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref }}
          files: bin/*

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.version, 'v'))
    needs: [build-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: napi

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('napi/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile
        working-directory: napi

      - name: Set npm package version
        shell: bash
        working-directory: napi
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Create platform npm package dirs
        run: pnpm create-npm-dirs
        working-directory: napi

      - name: Download node artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: napi/artifacts
          merge-multiple: true

      - name: Copy native artifacts into platform packages
        run: pnpm artifacts
        working-directory: napi

      - name: Verify native artifacts
        shell: bash
        working-directory: napi
        run: |
          for target in \
            linux-x64-gnu \
            linux-arm64-gnu \
            darwin-x64 \
            darwin-arm64 \
            win32-x64-msvc \
            win32-arm64-msvc; do
            test -f "npm/${target}/kokorobox-native.${target}.node"
            test -f "npm/${target}/package.json"
          done
          test -f index.js
          test -f index.d.ts
          test -f README.md

      - name: Publish platform npm packages
        run: pnpm exec napi pre-publish --tag-style npm --no-gh-release
        working-directory: napi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          node - <<'NODE'
          const fs = require('node:fs')
          const [{ files }] = JSON.parse(fs.readFileSync('pack.json', 'utf8'))
          const names = files.map((file) => file.path)
          for (const required of ['index.js', 'index.d.ts', 'README.md', 'package.json']) {
            if (!names.includes(required)) {
              throw new Error(`Missing ${required} from main npm package`)
            }
          }
          const nativeFiles = names.filter((name) => name.endsWith('.node'))
          if (nativeFiles.length > 0) {
            throw new Error(`Main npm package must not include native binaries: ${nativeFiles.join(', ')}`)
          }
          NODE
        working-directory: napi

      - name: Publish npm package
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping"
            exit 0
          fi
          npm publish --ignore-scripts --access public --provenance
        working-directory: napi
