version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /napi
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Platform packages are released as an exact, matching set with the loader.
    ignore:
      - dependency-name: "kokorobox-native-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
