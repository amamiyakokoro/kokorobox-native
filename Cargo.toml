[workspace]
members = [".", "napi"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "kokorobox-native"
version = "0.5.5"
edition = "2024"
license = "GPL-3.0-only"
description = "KokoroBox native bridge"
repository = "https://github.com/amamiyakokoro/kokorobox-native"

[lib]
name = "kokorobox_native"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
file-icon = { git = "https://github.com/UruhaLushia/file-icon-rs.git" }
rule-converter = { git = "https://github.com/UruhaLushia/rule-converter.git", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", features = ["std"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
