[workspace]
members = [".", "napi", "traffic-presenter"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "kokorobox-native"
version = "0.15.0"
edition = "2024"
build = "build.rs"
license = "GPL-3.0-only"
description = "KokoroBox native bridge"
repository = "https://github.com/amamiyakokoro/kokorobox-native"

[lib]
name = "kokorobox_native"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8"] }
file-icon = { git = "https://github.com/UruhaLushia/file-icon-rs.git" }
getrandom = "0.4"
keyring = { version = "3", default-features = false }
rule-converter = { git = "https://github.com/UruhaLushia/rule-converter.git", default-features = false }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = { version = "0.6.4", features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
system-configuration = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"
keyring = { version = "3", default-features = false, features = [
    "crypto-rust",
    "linux-native-sync-persistent",
    "vendored",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
